name: Deploy to GitHub Pages

on:
 push:
  branches:
   - main

jobs:
 build-and-deploy:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Set up Node.js
     uses: actions/setup-node@v4
     with:
      node-version: "20"

   - name: Install dependencies
     run: npm ci

   - name: Build project
     run: npm run build

   - name: Configure Git user
     run: |
      git config --global user.email "jero@uppertech.net"
      git config --global user.name "jero-uppertech"
      git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
       GH_TOKEN: ${{ secrets.VKKOSHER }}
   - name: Run deploy
     env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
     run: npm run deploy
